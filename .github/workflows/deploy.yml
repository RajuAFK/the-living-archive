name: deploy

# Builds the static export and force-pushes out/ to the `deploy` branch,
# which Hostinger auto-pulls into public_html/. Same proven pipeline as the
# previous praxivision.com repo (cms-rebuild.yml).
#
# NOTE: content edits (case studies, hero, archive items) do NOT need a
# rebuild — they live in MySQL and are served by the PHP API at runtime.
# Rebuilds are only for code changes.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "data/**"
      - "public/**"
      - "scripts/**"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "postcss.config.mjs"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NEXT_PUBLIC_MEDIA_BASE: https://pub-b6df9c86ce26430caf9d07b91b02796f.r2.dev
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build (static export)
        run: npm run build

      # public/.htaccess ships automatically via the export; keep an explicit
      # copy as belt-and-braces (dotfiles have been dropped by tooling before).
      - name: Ensure .htaccess in out/
        run: cp public/.htaccess out/.htaccess

      - name: Publish out/ to deploy branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd out
          git init -q
          git config user.email "actions@github.com"
          git config user.name  "github-actions"
          git checkout -q -b deploy
          git add -A
          git commit -q -m "deploy: $(date -u +%Y-%m-%dT%H:%M:%SZ) (run ${{ github.run_id }})"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" deploy
